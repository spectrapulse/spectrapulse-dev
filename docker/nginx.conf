map $uri $cache_control {
    default                 "no-cache";
    ~^/fonts/               "public, max-age=31536000, immutable";
    ~\.(png|ico)$           "public, max-age=604800";
    ~\.css$                 "public, max-age=3600";
    ~^/(keys\.sh|robots\.txt|sitemap\.xml|humans\.txt)$ "public, max-age=300";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/xml image/svg+xml;

    add_header Cache-Control           $cache_control always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src https://static.cloudflareinsights.com; connect-src https://cloudflareinsights.com; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /keys.sh {
        default_type text/plain;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }
}
